name: Monitor Preco Teto

on:
  schedule:
    # A cada 5 min, das 13h às 21h UTC (10h às 18h em Brasília), seg a sex
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install yfinance pandas requests

      - name: Testar Telegram (só em execução manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_preco_teto.py --teste-telegram

      - name: Conferir preços
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_preco_teto.py --uma-vez ${{ github.event_name == 'workflow_dispatch' && '--ignorar-horario' || '' }}

      - name: Salvar estado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f estado.json ]; then git add estado.json; fi
          git diff --staged --quiet || (git commit -m "atualiza estado" && git push)
